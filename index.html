/* ---------- ゲーム本体 ---------- */
const PKG={cv:null,g:null,raf:0,s:null,pts:[],down:false};
function pkStart(){
  const P=G.pk,L=PK_LV[P.lv];
  const my=(P.order.length?P.order:[null]).map(id=>{const c=id&&cardById(id);return c?{n:c.name,st:Object.fromEntries(KEYS.map(k=>[k,effSt(c,k)])),cond:P.cond[id],c}:{n:'控え選手',st:{sho:60,tec:58,spd:60,pas:60,phy:60,def:50},cond:2}});
  const gc=P.gkId&&cardById(P.gkId);const gk=gc?{n:gc.name,st:Object.fromEntries(KEYS.map(k=>[k,effSt(gc,k)])),cond:P.cond[P.gkId],oib:gc.special==='oibore',c:gc}:{n:'控えGK',st:{spd:58,tec:58,sho:58,pas:50,phy:60,def:56},cond:P.cond._gk};
  const opp=pkOppTeam(L);
  PKG.s={opp,my,gk,g:[0,0],n:[0,0],log:[[],[]],first:Math.random()<.5?0:1,mode:'intro',t0:performance.now(),msg:{tx:'コイントス…',t0:performance.now(),col:'#ffffff'},ball:{x:BALL0.x,y:BALL0.y,r:11},kp:{set:false,dx:0,dh:0,rot:0},ripple:null,oibUsed:false,shake:0};
  const S=PKG.s;S.turn=S.first;S.myName=teamCalc().name||'あなた';S.looks={};S.msg={tx:S.first===0?'先攻はあなた！':'先攻は相手',t0:performance.now(),col:'#ffd23a'};
  P.phase='play';P.coins=0;P.win=null;P.gikkuri=null;M.roster.forEach(c=>{if(c.gikkuri>0)c.gikkuri=0});
  if(!PKG.cv)pkMakeCanvas();
  setTimeout(()=>pkNext(),1100);
}
function pkMakeCanvas(){
  const cv=document.createElement('canvas');cv.className='pkcv';cv.setAttribute('aria-label','PK戦の画面。上へフリックしてシュート、守るときは跳ぶ方向へフリック');
  PKG.cv=cv;PKG.g=cv.getContext('2d');
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*PW,y:(e.clientY-r.top)/r.height*PH,t:performance.now()}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}PKG.down=true;PKG.pts=[pos(e)];PKG.trail=[pos(e)]},{passive:false});
  cv.addEventListener('pointermove',e=>{if(!PKG.down)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(ev=>{const p=pos(ev);PKG.pts.push(p);PKG.trail.push(p)});if(PKG.trail.length>40)PKG.trail.splice(0,PKG.trail.length-40)},{passive:false});
  const up=e=>{if(!PKG.down)return;PKG.down=false;const p=pos(e);PKG.pts.push(p);pkFlick(PKG.pts);PKG.fade=performance.now()};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',()=>{PKG.down=false;PKG.pts=[]});
}
function pkMount(){
  const host=typeof document!=='undefined'&&document.getElementById('pkhost');if(!host||!PKG.cv)return;
  if(PKG.cv.parentNode!==host)host.appendChild(PKG.cv);
  const w=host.clientWidth||360,dpr=Math.min(3,window.devicePixelRatio||1),W=Math.round(w*dpr),H=Math.round(w*PH/PW*dpr);
  if(PKG.cv.width!==W||PKG.cv.height!==H){PKG.cv.width=W;PKG.cv.height=H}
  if(!PKG.raf)PKG.raf=requestAnimationFrame(pkLoop);
}
function pkLoop(ts){PKG.raf=0;if(!PKG.cv||!document.body.contains(PKG.cv))return;try{pkDraw(ts)}catch(e){console.warn(e)}PKG.raf=requestAnimationFrame(pkLoop)}
// 決着判定（5本ずつ→サドンデス）
function pkDone(g,n){const r0=Math.max(0,5-n[0]),r1=Math.max(0,5-n[1]);
  if(n[0]<=5&&n[1]<=5){if(g[0]>g[1]+r1||g[1]>g[0]+r0)return true;if(n[0]===5&&n[1]===5)return g[0]!==g[1];return false}
  return n[0]===n[1]&&g[0]!==g[1]}
function pkNext(){
  const S=PKG.s;if(!S)return;
  if(pkDone(S.g,S.n)){pkEnd();return}
  S.turn=S.n[0]===S.n[1]?S.first:1-S.first;
  const now=performance.now();S.ball={x:BALL0.x,y:BALL0.y,r:11,shY:BALL0.y,spin:0};S.shot=null;S.kp={x:0,h:0,p:0,t0:0,dur:.3,dx:0,dh:0,rot:0,set:false};S.ripple=null;S.res=null;
  if(S.turn===0){const k=S.my[S.n[0]%S.my.length];S.kicker=k;S.mode='aim';S.msg={tx:`${S.n[0]+1}本目：${k.n}`,t0:now,col:'#ffffff',sub:condOf(k.cond).n}}
  else{const k=S.opp.ks[S.n[1]%S.opp.ks.length];S.kicker=k;S.mode='runup';S.ru={t0:now+500,dur:(800+Math.random()*600)/1000};S.msg={tx:`相手 ${S.n[1]+1}本目：${k.n}`,t0:now,col:'#9fd0ff',sub:'跳ぶ方向へフリック！'};
    // 緊急時（入れられたら負けが近い）にバツ丸尾君が覚醒
    const g2=S.g.slice(),n2=S.n.slice();g2[1]++;n2[1]++;const danger=pkDone(g2,n2)&&g2[1]>g2[0]||S.n[1]>=5;
    S.oibNow=!!(S.gk.oib&&!S.oibUsed&&danger);if(S.oibNow){S.oibUsed=true;S.msg={tx:'「おいぼれでも経験はあるんじゃよ」',t0:now,col:'#ffd23a',sub:'判断180！ 守備範囲が大きく広がる'}}}
}
// 指の動きから、シュートかダイブを決める
function pkFlick(pts){
  const S=PKG.s;if(!S||pts.length<2)return;
  const a=pts[0],b=pts[pts.length-1],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);
  // 最後の80msの速さ
  let i=pts.length-1;while(i>0&&b.t-pts[i].t<80)i--;const q=pts[i],dt=Math.max(16,b.t-q.t)/1000,v=Math.hypot(b.x-q.x,b.y-q.y)/dt,vAll=len/Math.max(.016,(b.t-a.t)/1000);
  const speed=Math.max(v*.6+vAll*.4,vAll);
  if(S.turn===0&&S.mode==='aim'){
    if(Math.hypot(a.x-S.ball.x,a.y-S.ball.y)>90||dy>-30||len<35)return;
    // 曲がり：指の軌跡が直線からどれだけふくらんだか（右にふくらむと＋）
    let dev=0;const nx=-dy/len,ny=dx/len;pts.forEach(p=>{const d=(p.x-a.x)*nx+(p.y-a.y)*ny;if(Math.abs(d)>Math.abs(dev))dev=d});
    const c=clamp(-dev/len,-.45,.45);pkShoot(Math.atan2(dx,-dy),speed,c)}
  else if(S.turn===1&&(S.mode==='runup'||S.mode==='fly')&&!S.kp.set){
    const now=performance.now();if(len<18){pkDive(0,.25,now);return}
    pkDive(dx/len*Math.min(len*1.5,400),-dy/len*Math.min(len*1.5,400),now)}
}
// 自分のシュート
function pkShoot(ang,speed,curve){
  const S=PKG.s,k=S.kicker,cd=condOf(k.cond).d,now=performance.now();
  const acc=(102-k.st.sho)*.5*(cd<0?1-cd*.12:1-cd*.05),accH=(102-k.st.sho)*.0055*(cd<0?1-cd*.12:1-cd*.05);
  const bend=curve*(.6+k.st.tec/200);
  let gx=BALL0.x+Math.tan(clamp(ang,-1.2,1.2))*205+bend*70+gauss()*acc;
  let gh=clamp((speed-650)/1900,.02,1.6)+gauss()*accH;gh=Math.max(.02,gh);
  const D=clamp(.95-(speed-650)/3800,.42,.95)*(1-(k.st.sho-70)*.003);
  S.shot={sx:BALL0.x,sy:BALL0.y,gx,gh,curve:bend*230,D,lift:12+gh*20,t0:now+120,mine:1};S.mode='fly';S.kickT=now;
  // 相手GKの読み
  const G0=S.opp.gk,gcd=condOf(G0.cond).d,read=Math.random()<clamp(.26+(G0.st.def-70)*.006+gcd*.02+(speed<1100?.25:0),.08,.7);
  let tx,th;if(read){tx=gx-KP0.x+gauss()*24;th=Math.min(.92,gh+gauss()*.15)}else{const side=Math.random();tx=side<.2?0:side<.6?-80:80;th=Math.random()*.7}
  const reach=78+(G0.st.phy-70)*.6+(G0.st.spd-70)*.4+gcd*2;const d=Math.hypot(tx,th*GHT);const sc=d>reach?reach/d:1;
  const delay=Math.max(.05,.15-(G0.st.spd-70)*.002);
  setTimeout(()=>{if(S.mode!=='fly')return;pkDive(tx*sc,th*GHT*sc,performance.now(),G0)},(120+delay*1000));
}

(function(){var busy=false,shown=false;

 shown=true;var d=document.createElement('div');d.className='upd';d.innerHTML='<b>新しい版があります</b><button type="button">更新する</button>';d.querySelector('button').onclick=function(){location.reload()};document.body.appendChild(d)}).catch(function(){busy=false})}
window.addEventListener('load',function(){setTimeout(function(){check(true)},800)});

setInterval(function(){check(false)},300000);})();
