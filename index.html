/* ----- オファー・交渉・進路 ----- */
function c2Offers(p,X){
  const N=NATN(p);
  if(p.stage!=='pro'){
    if(N.poor>0)X.list=X.list.filter(()=>Math.random()>N.poor*.8);
    if(p.stage==='hs'&&N.poor>=.3&&!p.flags.scholar)delete X.uniEnter;
    if(p.stage==='hs'&&!X.list.length&&!X.uniEnter)X.poorEnd=1;
    if(p.stage==='uni'&&p.uniYear>=4&&!X.list.length&&N.poor>=.3)X.poorEnd=1;
  }else{
    if(p.contY>0)p.contY--;
    if(p.contY>0&&p.contClub===p.club){
      let r=X.list.find(o=>o.renew);
      if(!r){r={club:p.club,renew:true,sal:p.salary};X.list.unshift(r);X.released=false}
      r.sal=p.salary;r.locked=1;
    }
  }
}
function negOpen(i){
  const of=S.offers.list[i];if(!of||of.locked||of.final)return false;
  S.neg={i,sal:1,pt:0,yrs:2,ag:S.p.agent?1:0,msg:null};S.screen='neg';return true;
}
const NEG_SAL=[['控えめ',.9,-.05],['提示額',1,0],['強気',1.2,.2],['超強気',1.4,.4]];
const NEG_PT=[['なし',1,0],['準レギュラー',.96,.1],['レギュラー確約',.9,.25]];
const NEG_YR=[[1,1.04,.02],[2,1,0],[3,.97,.03],[4,.94,.07]];
function negProb(p,N){
  const of=S.offers.list[N.i],c=CLUBS[of.club],o=ovrOf(p);
  let r=NEG_SAL[N.sal][2]+NEG_PT[N.pt][2]*(1+Math.max(0,c.rep-o)/8)+NEG_YR[N.yrs-1][2];
  const pr=.92-r+(o-c.rep)/40+p.pop/500+(N.ag?.15:0)-(of.renew&&p.coach<40?.1:0);
  return clamp(pr,.05,.97);
}
function negMul(N){return NEG_SAL[N.sal][1]*NEG_PT[N.pt][1]*NEG_YR[N.yrs-1][1]*(N.ag?1.08:1)}
H.neg=()=>{
  const p=S.p,N=S.neg,X=S.offers,of=X.list[N.i],c=CLUBS[of.club],L=LG[c.lg],pr=negProb(p,N),sal=Math.round(of.sal*negMul(N)/10)*10;
  const seg=(key,arr,lab)=>`<div class="seg c${arr.length}">${arr.map((a,i)=>{const v=key==='yrs'?a[0]:i;return `<button class="opt" aria-pressed="${N[key]===v}" data-act="negSet" data-v="${key}:${v}">${key==='yrs'?a[0]+'年':a[0]}${lab?`<span class="d">${lab(a,i)}</span>`:''}</button>`}).join('')}</div>`;
  return `${pcard(p,'compact')}<div class="kick">契約交渉<span class="r">${esc(c.n)}</span></div>
  <p class="note">${esc(L.n)}・チーム力${c.rep}。クラブの提示は年俸${yen(of.sal)}。条件を上げるほど交渉は決裂しやすい。</p>
  <div class="label">年俸の要求</div>${seg('sal',NEG_SAL,a=>`×${a[1]}`)}
  <div class="label">出場の保証</div>${seg('pt',NEG_PT,(a,i)=>i?'出場機会↑・年俸少し↓':'')}
  <div class="label">契約年数</div>${seg('yrs',NEG_YR,a=>a[0]>=3?'長期は安定・年俸↓':a[0]===1?'短期・年俸少し↑':'標準')}
  <div class="label">代理人</div>
  <div class="seg c2"><button class="opt" aria-pressed="${!N.ag}" data-act="negSet" data-v="ag:0" ${p.agent?'disabled':''}>自分で交渉<span class="d">手数料なし</span></button><button class="opt" aria-pressed="${!!N.ag}" data-act="negSet" data-v="ag:1">代理人に任せる<span class="d">${p.agent?'契約中':'成功率↑年俸↑・以後 年俸の5%'}</span></button></div>
  ${N.msg?`<div class="toast">${esc(N.msg)}</div>`:''}
  <table class="st" style="margin-top:14px"><tbody><tr><th>この条件の年俸</th><td class="n">${yen(sal)}</td></tr><tr><th>交渉成立の見込み</th><td class="n"><b>${Math.round(pr*100)}%</b></td></tr></tbody></table>
  <div class="stack" style="margin-top:14px"><button class="btn red" data-act="negGo">この条件で交渉する</button><button class="btn" data-act="negBase">提示どおりで契約する</button><button class="btn ghost" data-act="negBack">ほかのオファーを見る</button></div>`;
};
function negFinish(i,yrs,pt){
  const p=S.p;decide('offer',i);
  p.contY=yrs;p.contClub=p.club;p.ptG=pt;p.ptClub=p.club;
}
function offersExtra(p,X){
  const N=NATN(p),out=[];
  if(X.negMsg)out.push(`<div class="toast">${esc(X.negMsg)}</div>`);
  if(p.stage==='pro'&&p.contY>0&&p.contClub===p.club)out.push(`<p class="note">今のクラブとの契約は残り${p.contY}年。クラブはあなたを放出できない${p.ptG?`（出場保証：${NEG_PT[p.ptG][0]}）`:''}。</p>`);
  if(p.stage==='hs'){
    if(X.uniEnter&&natOf(p)!=='jp')out.push(`<p class="note">大学は日本の${esc(UNIS[X.uniEnter].n)}への留学になる。</p>`);
    if(!X.abroad){const cost=30,ok=p.money>=cost||p.flags.scholar;
      out.push(`<div class="offer"><div class="top"><div><div class="club">海外挑戦</div><div class="lg">${natOf(p)==='jp'?'欧州・南米・アメリカ':'日本・欧州など'}のクラブの入団テストを受ける</div></div><div class="stars">TEST</div></div><p class="sub" style="margin:0">渡航費 ${yen(cost)}${p.flags.scholar?'（奨学金で無料）':''}。合格すれば海外クラブとプロ契約。不合格でも、ほかの道は残る。</p><button class="btn" data-act="abroadTest" ${ok?'':'disabled'}>${ok?'テストを受けに行く':'お金が足りない'}</button></div>`)}
    else out.push(`<div class="toast">${esc(X.abroad)}</div>`);
  }
  if(X.poorEnd){
    out.push(`<div class="evcard"><h2>${N.war?'道が閉ざされていく':'夢と暮らしのあいだで'}</h2><p>${N.war?'情勢のせいでスカウトは来ず、テストの話もなくなった。':'どのクラブからも声はかからず、家計はもう限界だ。'}${p.hope!=null?`夢の灯は残り${Math.round(p.hope)}。`:''}</p></div>`);
    if((p.hsExtra||0)<2&&p.age<=20)out.push(`<button class="btn" data-act="hsAgain">もう1年、働きながらチャンスを待つ</button>`);
    out.push(`<button class="btn ghost" data-act="giveUp">サッカーをあきらめる</button>`);
  }
  return out.join('');
}
function abroadTarget(p){
  const lgs=natOf(p)==='jp'?['BEL','NED','POR','BRA','USA','KOR']:['J2','J1','BEL','POR','USA','NED'];
  const home=homeCty(p),o=ovrOf(p);
  let pool=CLUBS.filter(c=>lgs.includes(c.lg)&&LG[c.lg].cty!==home).sort((a,b)=>a.rep-b.rep);
  const near=pool.filter(c=>c.rep<=o+6);return pick((near.length?near:pool).slice(-4))||pool[0];
}

function epilogue(p,s,k){
  const N=NATN(p),club=(s.clubs||'').split(' / ').pop()||'古巣',sc=s.score||0,r=Math.random();
  const t=[];
  if(k==='coach'){
    if(sc>=1450&&r<.6)t.push(`引退から6年後、${N.team}の監督に就任した。選手時代と同じく、誰よりも早くグラウンドに来る監督だった。`);
    else if(sc>=600&&r<.7)t.push(`指導者ライセンスを取り、${club}の監督に就任。就任3年目、選手たちに胴上げされた。`);
    else t.push('ユースの指導者になった。派手な肩書きはないが、教え子が何人もプロになった。');
  }else if(k==='pundit'){
    if(p.pop>=55)t.push('テレビ中継の解説者として人気者になった。歯に衣着せぬ物言いで、毎週のように話題になった。');
    else t.push('ラジオや地方局で解説を続けた。穏やかな語り口と、選手への優しいまなざしで愛された。');
  }else if(k==='biz'){
    if(p.money>=5000&&r<.7)t.push('自分の名を冠したスポーツブランドを立ち上げ、大きな成功を収めた。');
    else if(r<.55)t.push('小さなカフェを開いた。壁には現役時代のユニフォームが飾られ、ファンの集まる場所になった。');
    else t.push('最初の事業はうまくいかなかった。それでも子ども向けのサッカー教室で再起し、町の人気者になった。');
  }else{
    t.push(N.poor||N.war?`故郷${N.n}に小さなサッカー学校を開いた。スパイクのない子どもたちに、道具と居場所を届けた。10年後、その学校から初めてのプロ選手が生まれた。`:'故郷に小さなサッカー学校を開いた。週末のグラウンドには、いつも子どもたちの声が響いている。');
  }

function c4Month(p,a,res,m,first){
  const it=p.items||{},sb=p.subs||{};
  if(it.sauna)p.fat=clamp((p.fat||0)-2.5,0,100);
  if(sb.yoga)p.fat=clamp((p.fat||0)-1,0,100);
  if(it.bed)p.sta=clamp(p.sta+2,0,100);
  if(sb.cook)p.sta=clamp(p.sta+1,0,100);
  if(p.car==='ev')p.sta=clamp(p.sta+1,0,100);
  if(p.car==='camper'&&p.fam.partner&&p.fam.partner.married)p.fam.happy=clamp(p.fam.happy+1,0,100);
  if(sb.kidlesson&&p.fam.kids.length)p.fam.happy=clamp(p.fam.happy+1.5,0,100);
  if(sb.lang&&isAbroad(p)){p.mates=clamp((p.mates==null?50:p.mates)+.8,0,100);p.coach=clamp(p.coach+.4,0,100)}
  if(it.jet&&isAbroad(p))p.fat=clamp((p.fat||0)-2,0,100);
  if(it.stream)p.pop=clamp(p.pop+.25,0,100);
  if(it.brand){const g=Math.round(p.pop*3+rnd(-10,30));p.money+=g;p.earnings+=Math.max(0,g);res.inc+=g}
  if(it.restaurant){const g=Math.round(rnd(-40,70)+p.pop*.3);p.money+=g;if(g>0)p.earnings+=g;res.inc+=g}
  stkMonth(p,res,m);
}
function c4Inj(p){return (p.items&&p.items.cryo?.9:1)*(p.subs&&p.subs.yoga?.92:1)*(p.items&&p.items.bike?1.04:1)}
function applyFx3(p,k,v){
  if(k==='stkMul'){const held=STOCKS.filter(s=>p.stk&&p.stk[s.c]&&p.stk[s.c].sh>0);if(!held.length)return null;const s=pick(held),x=mkt(p)[s.c];x.pr=Math.max(.2,x.pr*v);return [`${s.n}の株価`,v>=1?`+${Math.round((v-1)*100)}%`:`${Math.round((v-1)*100)}%`,v>=1?1:-1]}
  if(k==='stkAll'){const M=mkt(p);STOCKS.forEach(s=>{M[s.c].pr=Math.max(.2,M[s.c].pr*v)});return ['株式市場',v>=1?'全面高':'全面安',v>=1?1:-1]}
  if(k==='sellItem'){if(p.items[v]){delete p.items[v];return [shopItem(v).n,'手放した',0]}return null}
  if(k==='artSale'){const g=Math.round(5000*v);p.money+=g;p.earnings+=Math.max(0,g-5000);delete p.items.art;return ['絵画の売却',`+${yen(g)}`,1]}
  return typeof applyFx5==='function'?applyFx5(p,k,v):null;
}

/* ----- 身長 ----- */
const H_POS={GK:188,DF:183,MF:176,FW:179};
const H_ARCH={nordic:4,east:2,power:2,pacific:2,afr:1,balkan:3,grit:0,cat:0,tech:-1,tiki:-2,pace:1,asiaE:-4,sasia:-4,asiaW:-1,gulf:-2,afrN:-1,andes:-3,carib:0,micro:0};
const H_NAT={nl:5,me:5,ba:4,rs:4,dk:3,is:3,de:2,jp:-2,kr:-1,id:-5,ph:-4,vn:-5,mx:-3,pe:-3,bo:-3,gt:-4};
function rollHeight(pos,nat){const N=NATIONS[nat]||{};return Math.round(clamp((H_POS[pos]||180)+(H_ARCH[N.arch]||0)+(H_NAT[nat]||0)+gauss()*6.5,157,204))}
function hTraits(h,pos){
  const t=[];if(!h)return t;
  if(h>=190)t.push('空中戦の王様');else if(h>=184)t.push('空中戦に強い');
  if(h<=168)t.push('重心が低く小回りが利く');else if(h<=173)t.push('ドリブルがしやすい');
  if(pos==='GK'&&h>=190)t.push('守備範囲が広い');if(pos==='GK'&&h<=178)t.push('ハイボールが苦手');
  if(h>=194)t.push('体が大きくケガ・疲労に注意');
  if(h<=168)t.push('当たりには弱い');
  return t;
}
function heightApply(pl){
  const dh=pl.height-180,adj={};
  if(dh>0){adj.phy=dh*.22;adj.spd=-dh*.1;adj.tec=-dh*.08;if(pl.pos==='DF'||pl.pos==='GK')adj.def=dh*.15;if(pl.pos==='FW')adj.sho=dh*.05}
  else{const s=-dh;adj.tec=s*.16;adj.spd=s*.12;adj.phy=-s*.16;if(pl.pos==='GK')adj.def=-s*.12}
  for(const [k,v] of Object.entries(adj)){const c=v*.6;pl.cap[k]=clamp(pl.cap[k]+c,30,SMAX);if(pl.capLim)pl.capLim[k]=Math.max(pl.capLim[k]||0,Math.round(pl.cap[k]));pl.st[k]=clamp(pl.st[k]+v,20,Math.min(85,pl.cap[k]-2))}
}
function c5Make(pl,d){
  pl.height=d.height||rollHeight(pl.pos,pl.nation||'jp');heightApply(pl);
  const N=NATIONS[pl.nation||'jp'];
  pl.flags.nlg={age:pl.age+ri(1,8),m:ri(0,11)};
  return pl;
}
const hGoal=p=>p.height?(1+clamp((p.height-182)/120,-.06,.12)*(p.pos==='FW'||p.pos==='DF'?1:.4)):1;
const hInj=p=>!p.height?1:p.height>=193?1.12:p.height<=168?.92:1;
const hClutch=(p,ty)=>!p.height?0:ty==='hed'?(p.height-180)/150:ty==='dri'?-(p.height-178)/200:ty==='save'?(p.height-186)/150:0;

const zoneOf=k=>ZMAP[k]||'west';
const SEAS=m=>m===12||m<=2?'win':m<=5?'spr':m<=8?'sum':'aut';
// 国と月（1〜12）から天気を引く。r は乱数（0〜1）を返す関数
function wxRoll(k,cm,r){
  const Z=ZONES[zoneOf(k)]||ZONES.west,sm=SOUTH.has(k)?((cm+5)%12)+1:cm,w={};
  const add=o=>{if(o)for(const [id,v] of Object.entries(o))w[id]=(w[id]||0)+v};
  add(Z.base);add(Z[SEAS(sm)]);add(Z.m&&Z.m[cm]);
  const ids=Object.keys(w);let tot=ids.reduce((s,id)=>s+w[id],0),x=(r||Math.random)()*tot;
  for(const id of ids){x-=w[id];if(x<=0)return id}return ids[ids.length-1]||'sun';
}

/* ----- 対戦（シード付きの試合エンジン）：会場と天気もシードで決まる ----- */
function wxBattle(X){
  const r=rng((X.seed^0x5bd1e995)>>>0);
  const vk=wpickR(r,NAT_REAL,k=>Math.max(.3,(NATIONS[k].str||50)-40)),cm=1+Math.floor(r()*12),id=wxRoll(vk,cm,r),W=WX[id];
  X.wx={id,k:vk,cm,first:r()<.5?0:1,sq:W.win?1+Math.floor(r()*14):-1,th:W.thunder&&r()<.5?2+Math.floor(r()*14):-1};
  X.wxD=[{atk:0,mid:0,def:0},{atk:0,mid:0,def:0}];X.wxPc=W.pc||0;
  const add=(i,a,m,d)=>{const Y=X.T[i],D=X.wxD[i];Y.atk+=a;Y.mid+=m;Y.def+=d;D.atk+=a;D.mid+=m;D.def+=d};X.wxAdd=add;
  for(let i=0;i<2;i++)add(i,W.a||0,W.m||0,W.df||0);
  if(W.fav){const [k,s]=W.fav,av=Y=>{const l=Y.pl.filter(p=>!p.dog);return l.reduce((t,p)=>t+(k==='phy'?(p.phy!=null?p.phy:60):(p.pas||60)),0)/(l.length||1)};
    const df=clamp((av(X.T[0])-av(X.T[1]))/8,-2,2)*s/2;if(Math.abs(df)>.05){add(0,df,df*.5,df);add(1,-df,-df*.5,-df)}}
  if(W.side){add(X.wx.first,W.side,0,0);add(1-X.wx.first,-W.side*.6,0,0)}
  const N=NATIONS[vk];
  X.ev.push({m:0,s:-1,ty:'cond',tx:`会場：${N.fl} ${N.n}（${cm}月）　天気：${W.i} ${W.n}。${W.d}${W.side?`。前半は${X.T[X.wx.first].name||'片方'}が風上`:''}`});
}
const wpickR=(r,arr,w)=>{let t=0;for(const a of arr)t+=w(a);let x=r()*t;for(const a of arr){x-=w(a);if(x<=0)return a}return arr[arr.length-1]};
function wxSeg(X){
  if(!X.wx)return;const W=WX[X.wx.id],s=X.seg;
  if(X.wx.sq>=0){if(s===X.wx.sq){for(let i=0;i<2;i++)X.wxAdd(i,0,W.wm,0);X.ev.push({m:s*5,s:-1,ty:'cond',tx:`${W.i} スコールが降り出した！ ピッチが一気に水びたしに`})}
    if(s===X.wx.sq+(W.win||3)){for(let i=0;i<2;i++)X.wxAdd(i,0,-W.wm,0);X.ev.push({m:s*5,s:-1,ty:'cond',tx:'☀️ スコールが止んだ。また日が差してきた'})}}
  if(X.wx.th>=0&&s===X.wx.th)X.ev.push({m:s*5,s:-1,ty:'cond',tx:'🌩️ 雷が近づき、試合が一時中断。両チームいったん引き上げる'});
}
function wxHalf(X){
  if(!X.wx)return;const W=WX[X.wx.id];
  if(W.h2){for(let i=0;i<2;i++)X.wxAdd(i,W.h2,0,W.h2);X.ev.push({m:46,s:-1,ty:'cond',tx:`${W.i} ${W.n}で後半は両チームとも足が重い`})}
  if(W.side){const f=X.wx.first;X.wxAdd(f,-W.side*1.6,0,0);X.wxAdd(1-f,W.side*1.6,0,0);X.ev.push({m:46,s:-1,ty:'cond',tx:`${W.i} 後半はエンドが替わり、${X.T[1-f].name||'相手'}が風上に`})}
}

/* ----- 育成の試合 ----- */
function wxCareerVenue(p,comp,home,neutral){
  const club=clubOf(p),own=natOf(p);
  if(comp==='nat'){if(neutral){const y=calYear(p),h=HASH('host'+y);return NAT_REAL[h%NAT_REAL.length]}return home?own:pick(NAT_REAL)}
  const lgk=club.lg,L=LG[lgk],k=L&&L.cty&&L.cty!=='*'?ctyToKey(L.cty):own;
  return k||own;
}
function wxCareer(p,comp,home,neutral){
  const k=wxCareerVenue(p,comp,home,neutral),cm=+MONTHS[p.month]||1,id=wxRoll(k,cm);return {id,k,cm};
}
// 天気によって選手ごとの得点しやすさ・評価が少し変わる
function wxPlayer(p,W){
  const s=p.st,ph=(s.phy-s.tec)/100,h=p.height||180;let g=1,rt=0;
  if(['rain','heavy','tsuyu','monsoon','squall','typhoon','hurricane','cyclone','snow','bliz'].includes(W.id)){g*=1+clamp(ph,-.15,.15)+(h-180)/400;rt+=ph*.6}
  if(['karakaze','westerly','wind','pampero','fog','sand','harmattan'].includes(W.id)){g*=1-clamp((s.sho-s.tec)/300,-.1,.1);rt+=(s.pas-60)/250}
  if(['heat','humid','alt','sirocco'].includes(W.id)){rt-=(p.fat||0)/200;g*=1-(p.fat||0)/400}
  return {g,rt};
}
function wxGoals(n,g){if(g<1){let k=0;for(let i=0;i<n;i++)if(Math.random()<g)k++;return k}return n+poisson(Math.max(0,(g-1))*1.3)}

function wxOverlay(g,id,t,Wd,Hd){
  const W=WX[id];if(!W||!W.v)return;const w=Wd,h=Hd,v=W.v;
  if(v==='rain'||v==='rain2'||v==='storm'){const n=v==='rain'?60:110;g.fillStyle=v==='rain'?'rgba(30,40,60,.18)':'rgba(20,30,50,.32)';g.fillRect(0,0,w,h);g.fillStyle='rgba(200,220,255,.6)';
    const sl=v==='storm'?2.2:.4;for(let i=0;i<n;i++){const x=(i*37+t*40*sl+t*30)%w,y=(i*53+t*170)%h;g.fillRect(Math.round(x),Math.round(y),1,v==='rain'?3:5)}
    if(v==='storm'&&Math.sin(t*1.7)>.985){g.fillStyle='rgba(255,255,255,.35)';g.fillRect(0,0,w,h)}}
  else if(v==='snow'||v==='snow2'){if(v==='snow2'){g.fillStyle='rgba(230,240,255,.25)';g.fillRect(0,0,w,h)}g.fillStyle='#ffffff';const n=v==='snow'?50:110;for(let i=0;i<n;i++)g.fillRect(Math.round((i*41+Math.sin(t+i)*6+t*(v==='snow2'?60:6))%w),Math.round((i*29+t*16)%h),2,2)}

/* ========== スカッドの一括編成：能力を見て、各ポジションにいちばん合う選手を入れる ========== */
function autoPlan(form){
  const F=FORMS[form]||FORMS['433'],roles=F.s.map(s=>s[0]);
  const pool=M.roster.filter(c=>!isMgr(c)&&!isLegSup(c)&&!(c.gikkuri>0));
  const val=(c,role)=>cardOvr(c,role)*(typeof fitOf==='function'?fitOf(c,role):fitMul(c.pos,role))*(typeof staFac==='function'?staFac(cardSta(c)):1);
  // 1) 値の高い組み合わせから順に埋める
  const pairs=[];roles.forEach((r,i)=>pool.forEach(c=>pairs.push({i,c,v:val(c,r)})));pairs.sort((a,b)=>b.v-a.v);
  const slots=Array(11).fill(null),used=new Set();
  for(const q of pairs){if(slots[q.i]||used.has(q.c.id))continue;slots[q.i]=q.c.id;used.add(q.c.id)}
  const sq=()=>({form,slots,bench:[],mgr:null,tac:M.squad.tac,name:M.squad.name});
  const score=()=>{const T=teamCalc(sq());return T.atk+T.mid+T.def};
  // 2) 特別スキルのあるキャラ（キャプテン・帝国・政夫と犬など）は、入れたほうが強くなるなら入れ替える
  let best=score();
  for(const c of pool.filter(c=>c.special&&!slots.includes(c.id))){
    let bi=-1,bs=best;
    for(let i=0;i<11;i++){if(roles[i]==='GK'&&c.pos!=='GK')continue;const old=slots[i];slots[i]=c.id;const s=score();if(s>bs+.05){bs=s;bi=i}slots[i]=old}
    if(bi>=0){slots[bi]=c.id;best=bs}
  }
  // 3) ベンチ：残りから総合力の高い順（GKの控えを1人は入れる）
  const rest=pool.filter(c=>!slots.includes(c.id)).sort((a,b)=>cardOvr(b)-cardOvr(a));
  const bench=[];const gk=rest.find(c=>c.pos==='GK');if(gk)bench.push(gk.id);
  for(const c of rest){if(bench.length>=12)break;if(!bench.includes(c.id))bench.push(c.id)}
  while(bench.length<12)bench.push(null);
  const mg=M.mgrs.slice().sort((a,b)=>mgrOvr(b)-mgrOvr(a))[0];
  return {form,slots,bench,mgr:mg?mg.id:M.squad.mgr,tot:Math.round(best/3*10)/10};
}
function autoSquad(mode){
  const before=teamCalc().tot;
  let P;if(mode==='best'){P=Object.keys(FORMS).map(f=>autoPlan(f)).sort((a,b)=>b.tot-a.tot)[0]}else P=autoPlan(M.squad.form);
  M.squad.form=P.form;M.squad.slots=P.slots;M.squad.bench=P.bench;M.squad.mgr=P.mgr;G.sq.slot=null;
  const after=teamCalc().tot;
  G.toastMsg=`一括編成した（${FORMS[P.form].n}・総合 ${before} → ${after}）`;
  metaSave();
}

function chemCalc(cards){
  const out=new Map(),add=(c,v,why)=>{const o=out.get(c)||{b:0,why:[]};o.b+=v;o.why.push(why);out.set(c,o)};
  const real=cards.map(x=>x.c).filter(c=>c&&!c.filler);
  const by={};real.forEach(c=>{if(c.nation)(by[c.nation]=by[c.nation]||[]).push(c)});
  const links=[];
  Object.entries(by).forEach(([k,l])=>{if(l.length<2)return;const v=l.length>=4?3:l.length===3?2:1,N=NATIONS[k];l.forEach(c=>add(c,v,`${N?N.n:k}の仲間+${v}`));links.push({t:`${N?N.fl+' '+N.n:k}の選手${l.length}人`,v,n:l.length})});
  const cl={};real.forEach(c=>(c.clubs||[]).forEach(n=>{(cl[n]=cl[n]||new Set()).add(c)}));
  Object.entries(cl).forEach(([n,s])=>{if(s.size<2)return;[...s].forEach(c=>add(c,2,`${n}の元チームメイト+2`));links.push({t:`${n}の元チームメイト${s.size}人`,v:2,n:s.size})});
  const ga=real.filter(c=>c.from==='ガチャ'&&!c.legend&&c.special);if(ga.length>=3){ga.forEach(c=>add(c,1,'ガチャ仲間+1'));links.push({t:`ガチャ仲間${ga.length}人`,v:1,n:ga.length})}
  out.forEach(o=>{o.b=Math.min(5,o.b)});out.links=links;return out}

/* ========== 編成：タップで入れ替え・カスタム布陣（位置とポジションを自分で決める） ========== */
const BENCH_N=12;
Object.defineProperty(FORMS,'custom',{enumerable:false,configurable:true,get(){const s=typeof M!=='undefined'&&M&&M.squad&&Array.isArray(M.squad.custom)&&M.squad.custom.length===11?M.squad.custom:FORMS['433'].s;return {n:'カスタム',s}}});
function sqRef(k){const sq=M.squad;if(typeof k==='string'&&k[0]==='b')return [sq.bench,+k.slice(1)];return [sq.slots,+k]}
function sqSwap(a,b){const [A,i]=sqRef(a),[B,j]=sqRef(b);const t=A[i];A[i]=B[j]===undefined?null:B[j];B[j]=t===undefined?null:t}
{const _ss=ACT.sqSlot;ACT.sqSlot=v=>{syncInputs();const i=v==='mgr'||String(v)[0]==='b'?v:+v,cur=G.sq.slot;
  if(cur!=null&&cur!=='mgr'&&i!=='mgr'&&cur!==i){const [A,x]=sqRef(cur),[B,y]=sqRef(i);if(A[x]||B[y]){sqSwap(cur,i);G.sq.slot=null;G.sq.place=false;G.toastMsg='入れ替えた';setTimeout(()=>{G.toastMsg=null;try{render()}catch(e){}},1200);return}}
  G.sq.place=false;G.sq.slot=cur===i?null:i}}
ACT.sqCustom=()=>{syncInputs();const sq=M.squad;if(!Array.isArray(sq.custom)||sq.custom.length!==11){const F=FORMS[sq.form]||FORMS['433'];sq.custom=F.s.map(x=>x.slice())}sq.form='custom';G.sq.slot=null};
ACT.sqCustomReset=()=>{const F=FORMS['433'];M.squad.custom=F.s.map(x=>x.slice())};
ACT.sqCustomFrom=v=>{const F=FORMS[v];if(F&&v!=='custom'){M.squad.custom=F.s.map(x=>x.slice());M.squad.form='custom'}};
ACT.sqRole=v=>{const i=G.sq.slot,C=M.squad.custom;if(M.squad.form!=='custom'||typeof i!=='number'||!C||!['GK','DF','MF','FW'].includes(v))return;
  if(C[i][0]==='GK'&&v!=='GK'){G.toastMsg='GKは1人必要。ほかの枠をGKにすると、ここは自動でDFになる';setTimeout(()=>{G.toastMsg=null;try{render()}catch(e){}},2500);return}
  if(v==='GK')C.forEach((s,j)=>{if(j!==i&&s[0]==='GK')s[0]='DF'});C[i][0]=v};
ACT.sqMove=v=>{const i=G.sq.slot,C=M.squad.custom;if(M.squad.form!=='custom'||typeof i!=='number'||!C)return;const d={u:[0,-4],d:[0,4],l:[-4,0],r:[4,0]}[v];if(!d)return;
  C[i][1]=clamp(C[i][1]+d[0],6,94);C[i][2]=clamp(C[i][2]+d[1],8,92)};
ACT.sqPlace=()=>{G.sq.place=!G.sq.place};
if(typeof document!=='undefined')document.addEventListener('click',e=>{if(!G.sq||!G.sq.place||M.squad.form!=='custom')return;const pt=e.target.closest('.pitch');if(!pt||e.target.closest('.slot'))return;
  const i=G.sq.slot;if(typeof i!=='number')return;const r=pt.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;
  M.squad.custom[i][1]=Math.round(clamp(x,6,94));M.squad.custom[i][2]=Math.round(clamp(y,8,92));G.sq.place=false;try{metaSave();render()}catch(err){}});
function customFormHtml(){const cus=M.squad.form==='custom';
  return `<div class="seg c2" style="margin-top:6px"><button class="opt" aria-pressed="${cus}" data-act="sqCustom">カスタム<span class="d">位置とポジションを自分で決める</span></button>${cus?`<button class="opt" data-act="sqCustomReset">4-3-3に戻す<span class="d">カスタムの形をリセット</span></button>`:`<button class="opt" data-act="sqCustomFrom" data-v="${M.squad.form}">今の形をもとに作る<span class="d">${esc((FORMS[M.squad.form]||{}).n||'')}をコピー</span></button>`}</div>`}
function slotEditHtml(){const i=G.sq.slot,cus=M.squad.form==='custom';
  if(typeof i!=='number'||!cus)return '';const s=M.squad.custom[i];
  return `<div class="sqedit"><div class="label">この枠の設定（カスタム）</div>
  <div class="seg c4">${['GK','DF','MF','FW'].map(r=>`<button class="opt" aria-pressed="${s[0]===r}" data-act="sqRole" data-v="${r}">${r}</button>`).join('')}</div>
  <div class="mvrow"><button class="opt" data-act="sqMove" data-v="l">←</button><button class="opt" data-act="sqMove" data-v="u">↑</button><button class="opt" data-act="sqMove" data-v="d">↓</button><button class="opt" data-act="sqMove" data-v="r">→</button>
  <button class="opt ${G.sq.place?'on':''}" data-act="sqPlace">${G.sq.place?'ピッチをタップ…':'タップで置く'}</button></div>
  <p class="sub">ポジションを選ぶと、その枠の役割が変わる。矢印で少しずつ動かすか、「タップで置く」を押してからピッチの好きな場所をタップ。ほかの枠を設定するときは、この枠をもう一度タップして選択を外してから（そのまま別の枠をタップすると選手が入れ替わる）。</p></div>`}

/* ========== いらない選手を素材に変える（10人 → 全素材100個ずつ） ========== */
const RC_N=10,RC_Q=100;
G.rc=G.rc||{on:false,sel:[]};
const rcOk=c=>c&&!isMgr(c)&&!M.squad.slots.includes(c.id)&&!M.squad.bench.includes(c.id);
ACT.rcOpen=()=>{G.rc.on=!G.rc.on;G.rc.sel=[]};
ACT.rcPick=v=>{const c=cardById(v);if(!rcOk(c))return;const s=G.rc.sel,i=s.indexOf(v);if(i>=0)s.splice(i,1);else s.push(v)};
ACT.rcGo=()=>{const s=G.rc.sel.filter(id=>rcOk(cardById(id)));const n=Math.floor(s.length/RC_N)*RC_N;if(!n)return;const use=s.slice(0,n),k=n/RC_N;
  M.roster=M.roster.filter(c=>!use.includes(c.id));MATK.forEach(m=>M.mats[m]=(M.mats[m]||0)+RC_Q*k);G.rc.sel=[];G.rc.on=false;metaSave();
  G.toastMsg=`${n}人を素材に変えた：育成素材${MATK.length}種類を${RC_Q*k}個ずつ獲得`;setTimeout(()=>{G.toastMsg=null;try{render()}catch(e){}},4000)};
function rcHtml(){
  if(!G.rc.on)return `<div class="stack" style="margin:4px 0 10px"><button class="btn ghost" data-act="rcOpen">いらない選手を素材に変える（${RC_N}人で全素材${RC_Q}個ずつ）</button></div>`;
  const L=M.roster.filter(rcOk).sort((a,b)=>cardOvr(a)-cardOvr(b)),n=G.rc.sel.length,k=Math.floor(n/RC_N);
  return `<div class="kick">素材に変える選手を選ぶ<span class="r">${n}人選択中</span></div>
  <p class="note">${RC_N}人ごとに、育成素材${MATK.length}種類を${RC_Q}個ずつもらえる。スタメンとベンチの選手は選べない。変えた選手は元に戻せない。</p>
  ${L.length?`<div class="plist">${L.map(c=>`<button class="prow" aria-pressed="${G.rc.sel.includes(c.id)}" data-act="rcPick" data-v="${c.id}"><span class="po">${c.pos}</span><b>${esc(c.name)}</b><span class="sub">${esc(c.from||'')}${c.special||c.legend?'・特別な選手':''}</span><span class="num">${cardOvr(c)}</span></button>`).join('')}</div>`:'<p class="note">変えられる選手がいない（スタメン・ベンチ以外の選手が対象）。</p>'}
  <div class="stack" style="margin-top:10px"><button class="btn red" data-act="rcGo" ${k?'':'disabled'}>${k?`${k*RC_N}人を素材に変える（全素材+${k*RC_Q}個ずつ）`:`あと${RC_N-n%RC_N}人選んでね`}</button><button class="btn ghost" data-act="rcOpen">やめる</button></div>`}

/* ========== スカッドの表示：スキルで上がった状態の能力（試合の途中で上がるものは含めない） ========== */
let DISPC=null;
function dispMap(){if(DISPC)return DISPC;DISPC=new Map();try{const sq=M.squad,F=FORMS[sq.form]||FORMS['433'],T=teamCalc(sq);
  F.s.forEach((s,i)=>{const c=cardById(sq.slots[i]),p=T.pl[i];if(c&&p&&!p.filler&&p.st)DISPC.set(c.id,p.st)})}catch(e){}return DISPC}
function dispSt(c,k){if(!c||isMgr(c))return effSt(c,k);const st=dispMap().get(c.id);if(st&&st[k]!=null)return Math.min(99,Math.round(st[k]));
  return Math.min(99,effSt(c,k)+(typeof sxSt==='function'?sxSt([{c,role:c.pos}],c,k):0))}
function dispOvr(c,role){if(!c||isMgr(c))return isMgr(c)?mgrOvr(c):0;const st={};KEYS.forEach(k=>st[k]=dispSt(c,k));return cardOvr({st,plus:{},pos:role||c.pos},role||c.pos)}
{const _r=render;render=function(){DISPC=null;return _r()}}
